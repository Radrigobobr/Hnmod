name: Build AK Prototype

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/ak-prototype/**'
      - '.github/workflows/build-ak-prototype.yml'

jobs:
  android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hnmod
        uses: actions/checkout@v4

      - name: Checkout Horizon Android SDK
        run: |
          git clone --depth 1 --branch android-port \
            https://github.com/Rayan-XOO/horizon.git horizon-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build AK Prototype
        run: bash mods/ak-prototype/build.sh

      - name: Upload AK Prototype
        uses: actions/upload-artifact@v4
        with:
          name: AK-Prototype-7.42
          path: mods/ak-prototype/target/ak_prototype.hnmod
          if-no-files-found: error
